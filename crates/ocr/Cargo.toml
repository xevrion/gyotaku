[package]
name = "gyotaku-ocr"
description = "PP-OCRv6 text detection and recognition on ONNX Runtime, tuned for screenshots"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
gyotaku-core.workspace = true
anyhow.workspace = true
fast_image_resize = { version = "6", features = ["image"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
# Loaded at run time from Microsoft's own build rather than linked, see
# models::runtime for why. Nothing to download or link at build time.
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["load-dynamic", "api-27"] }
sha2 = "0.11"
ureq = "3"

# Microsoft ships the runtime as a .tgz for Linux and a .zip for Windows.
[target.'cfg(not(windows))'.dependencies]
flate2 = "1"
tar = { version = "0.4", default-features = false }

[target.'cfg(windows)'.dependencies]
zip = { version = "8", default-features = false, features = ["deflate-flate2-zlib-rs"] }
