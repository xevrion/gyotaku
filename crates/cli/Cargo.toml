[package]
name = "gyotaku"
description = "Search every screenshot you have ever taken by the text inside it"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
build = "../../contrib/windows/resource.rs"

[dependencies]
gyotaku-core.workspace = true
gyotaku-ocr.workspace = true
anyhow.workspace = true
directories.workspace = true
clap = { version = "4.6", features = ["derive"] }
fast_image_resize = { version = "6", features = ["image"] }
image = { version = "0.25", default-features = false, features = ["bmp", "jpeg", "png"] }
jiff = "0.2"
notify = "8"

[build-dependencies]
embed-resource = "3.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["xfixes"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Power",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
