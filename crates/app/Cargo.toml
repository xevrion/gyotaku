[package]
name = "gyotaku-app"
description = "The gyotaku search window"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
build = "../../contrib/windows/resource.rs"

[[bin]]
name = "gyotaku-app"
path = "src/main.rs"

[dependencies]
gyotaku-core.workspace = true
anyhow.workspace = true
directories.workspace = true
# Pinned to zed main rather than the 0.2.2 release on crates.io. The release
# renders through blade, which is Vulkan only. Main moved to wgpu with a GL
# fallback, so the window still opens on old integrated graphics.
gpui = { git = "https://github.com/zed-industries/zed", rev = "0fb9a9da49993ee8061ff4a2feaa89966a79e91c" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "0fb9a9da49993ee8061ff4a2feaa89966a79e91c", features = ["font-kit", "wayland", "x11"] }
env_logger = "0.11"
futures = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
jiff = "0.2"
log = "0.4"
smallvec = "1"
unicode-segmentation = "1"

[build-dependencies]
embed-resource = "3.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
global-hotkey = "0.8"
# The menu bar icon on macOS and the notification area icon on Windows, from
# the same family as global-hotkey.
tray-icon = { version = "0.26", default-features = false }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    # MonitorFrom*, to open the window on the monitor being worked on.
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_UI_WindowsAndMessaging",
] }
# The window's native handle, to ask DWM for rounded corners.
raw-window-handle = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
# To run as an accessory app (no Dock icon), which gpui doesn't offer.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSRunningApplication"] }
