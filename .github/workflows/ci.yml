name: ci

on:
  # main only. Every other branch is checked through its pull request, so
  # listening to all pushes ran dependabot's branches twice.
  push:
    branches: [main]
    # Pushes that only touch the website, docs or artwork don't start a
    # runner at all (Vercel builds the site). Pull requests still always
    # run, since `ci result` is a required check there and a skipped
    # workflow would leave it waiting.
    paths-ignore:
      - 'site/**'
      - 'docs/**'
      - '**/*.md'
      - 'assets/**'
      - 'packaging/**'
  pull_request:
  # Rolling images (arch, tumbleweed, kali) can break the build with nothing
  # changing here, so the distro builds also run once a week regardless.
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# Reading the code is all any job here needs.
permissions:
  contents: read

# A new push to the same branch makes the running checks for the old one moot.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decides what the rest has to do. A docs change needs nothing, a code
  # change needs the quick check, and only a change to dependencies, the
  # toolchain or this file can break a distro build that passed before, so
  # only those pay for the six containers (about an hour of runner time).
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
      build: ${{ steps.diff.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          # Scheduled and manual runs check everything, and so does a push
          # whose base can't be found, rather than guess.
          if [ "$EVENT" = schedule ] || [ "$EVENT" = workflow_dispatch ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "$BASE" "$HEAD")
          echo "$files"
          code=false
          build=false
          # Here-strings, not pipes: with pipefail, grep -q exiting early can
          # SIGPIPE the echo and turn a match into a failure.
          # contrib/windows/resource.rs is both crates' build script, and runs
          # on Linux too.
          if grep -qE '^(crates/|tests/|Cargo\.(toml|lock)$|rust-toolchain\.toml$|rustfmt\.toml$|contrib/windows/resource\.rs$|\.github/workflows/ci\.yml$)' <<< "$files"; then
            code=true
          fi
          if grep -qE '(^|/)(Cargo\.toml|build\.rs)$|^Cargo\.lock$|^rust-toolchain\.toml$|^contrib/windows/resource\.rs$|^\.github/workflows/ci\.yml$' <<< "$files"; then
            build=true
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"

  check:
    name: fmt, clippy, tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config \
            libfontconfig-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev
      # rustup is on the runner, rust-toolchain.toml picks the version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --locked -- -D warnings
      - run: cargo test --workspace --locked

  # Builds from a clean checkout inside each distro's own image, with only
  # the packages the README tells people to install, then reads a real
  # screenshot. If a distro needs something the README doesn't say, this is
  # where it shows up. It waits for the quick check, so a formatting slip
  # doesn't cost an hour of containers.
  distro:
    name: ${{ matrix.name }}
    needs: [changes, check]
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu 22.04
            image: ubuntu:22.04
            install: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends build-essential pkg-config curl ca-certificates libfontconfig-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev
          - name: debian 12
            image: debian:12
            install: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends build-essential pkg-config curl ca-certificates libfontconfig-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev
          - name: kali
            image: kalilinux/kali-rolling
            install: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends build-essential pkg-config curl ca-certificates libfontconfig-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev
          - name: arch
            image: archlinux:latest
            install: pacman -Syu --noconfirm --needed base-devel curl fontconfig libxkbcommon-x11 wayland libxcb
          - name: fedora
            image: fedora:latest
            install: dnf install -y gcc gcc-c++ make pkgconf-pkg-config curl fontconfig-devel libxkbcommon-x11-devel wayland-devel libxcb-devel
          # The minimal Tumbleweed image has no bash, which the later steps use.
          - name: opensuse tumbleweed
            image: opensuse/tumbleweed
            install: zypper -n install bash gcc gcc-c++ make pkg-config curl tar gzip fontconfig-devel libxkbcommon-x11-devel wayland-devel libxcb-devel
    steps:
      - name: packages
        run: ${{ matrix.install }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: rust
        shell: bash
        run: |
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          # The whole PATH, not GITHUB_PATH: an image that doesn't declare
          # its own PATH (opensuse) would be left with nothing but cargo's
          # folder, and then not even a shell for the next step.
          echo "PATH=$HOME/.cargo/bin:$PATH" >> "$GITHUB_ENV"
      - name: build
        shell: bash
        run: cargo build --profile ci --locked
      - name: test
        shell: bash
        run: cargo test --profile ci --locked -p gyotaku-core -p gyotaku-ocr -p gyotaku
      - name: read a screenshot
        shell: bash
        run: |
          ./target/ci/gyotaku ocr tests/fixtures/settings.png --threads 2 | tee ocr.txt
          grep -q "cores per screenshot" ocr.txt

  # The one check branch protection requires. A job skipped by its `if`
  # reports under its unexpanded name, so requiring the distro jobs directly
  # would leave a docs-only pull request waiting forever. This passes when
  # everything that ran passed, and treats skipped as fine.
  result:
    name: ci result
    if: always()
    needs: [changes, check, distro]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for r in $RESULTS; do
            case "$r" in
              success|skipped) ;;
              *) exit 1 ;;
            esac
          done
