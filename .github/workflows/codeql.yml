name: CodeQL

# Only when there's something to analyze: the rust code, or the workflows.
# A docs change can't introduce a finding. This check isn't required by
# branch protection, so filtering at the trigger can't block a merge.
on:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/**'
  # A weekly run catches new queries landing in CodeQL itself, not just new code.
  schedule:
    - cron: '31 4 * * 1'

# No job gets a token wider than it asks for.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # Uploading results to the security tab needs write here, nothing else.
      security-events: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # rust for the code, actions for the workflows themselves, since a
        # workflow that runs untrusted input is its own way in.
        language: [rust, actions]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # build-mode none reads the source without compiling it, so this job
      # doesn't need the window libraries or the long gpui build.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: '/language:${{ matrix.language }}'
