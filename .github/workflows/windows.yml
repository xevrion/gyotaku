name: windows

# Builds, tests and packages the Windows version: a zip with both programs
# and ONNX Runtime beside them, so it runs without Rust or any download
# other than the OCR models on first use.
on:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.cargo/**'
      - 'tests/**'
      - 'contrib/windows/**'
      - 'assets/gyotaku.ico'
      - '.github/workflows/windows.yml'
  pull_request:
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.cargo/**'
      - 'tests/**'
      - 'contrib/windows/**'
      - 'assets/gyotaku.ico'
      - '.github/workflows/windows.yml'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  ORT_VERSION: 1.28.2
  ORT_SHA256: c4eedd29489d5feca21866d054638416f3655bf6b18851b3b6b85c8313e95c35

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: windows x64
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: build
        run: cargo build --release --locked
      - name: test
        run: cargo test --release --locked --workspace
      # Microsoft's own build, checked against the same hash the app pins.
      - name: onnx runtime
        run: |
          curl -sSfLo ort.zip "https://github.com/microsoft/onnxruntime/releases/download/v$ORT_VERSION/onnxruntime-win-x64-$ORT_VERSION.zip"
          echo "$ORT_SHA256  ort.zip" | sha256sum -c -
          unzip -q -j ort.zip "onnxruntime-win-x64-$ORT_VERSION/lib/onnxruntime.dll" -d target/release
      # onnxruntime.dll needs the Visual C++ runtime, which a fresh Windows
      # doesn't have. Microsoft allows shipping these beside the program.
      - name: visual c++ runtime
        run: |
          crt=$(ls -d "/c/Program Files/Microsoft Visual Studio/"*/*/VC/Redist/MSVC/*/x64/Microsoft.VC14*.CRT 2>/dev/null | sort -V | tail -n1)
          echo "from ${crt:-System32}"
          for dll in msvcp140.dll msvcp140_1.dll vcruntime140.dll vcruntime140_1.dll; do
            cp "${crt:-/c/Windows/System32}/$dll" target/release/
          done
      - name: read a screenshot
        run: |
          ./target/release/gyotaku.exe ocr tests/fixtures/settings.png --threads 2 | tee ocr.txt
          grep -q "cores per screenshot" ocr.txt
      - name: package
        run: |
          mkdir -p dist/gyotaku
          cp target/release/gyotaku-app.exe target/release/gyotaku.exe target/release/onnxruntime.dll dist/gyotaku/
          cp target/release/msvcp140.dll target/release/msvcp140_1.dll target/release/vcruntime140.dll target/release/vcruntime140_1.dll dist/gyotaku/
          cp LICENSE dist/gyotaku/LICENSE.txt
          cp crates/app/fonts/OFL.txt dist/gyotaku/FONTS-OFL.txt
          cp contrib/windows-readme.txt dist/gyotaku/README.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gyotaku-windows-x64
          path: dist/gyotaku
          if-no-files-found: error
      # Runs it the way a person does: a config saying which folder to read,
      # and nothing else. No models, no index. The app has to start the
      # hidden reader itself, which downloads the models and reads the
      # folder, and the screenshot has to turn up in the window. Then the
      # window is photographed: the grid, a search, settings, and the summon
      # key bringing it back. The runner draws with WARP (software Direct3D),
      # so this also covers machines without a usable GPU.
      - name: open the window
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          New-Item -ItemType Directory -Force shots | Out-Null
          function Shot($name) {
            Start-Sleep -Milliseconds 1200
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("shots\$name.png")
          }
          function Alive {
            if (-not (Get-Process gyotaku-app -ErrorAction SilentlyContinue)) { throw 'gyotaku-app is not running' }
          }

          $data = Join-Path $env:APPDATA 'gyotaku\data'
          Remove-Item -Recurse -Force $data -ErrorAction SilentlyContinue
          $shots = (Resolve-Path tests\fixtures).Path
          $cfg = Join-Path $env:APPDATA 'gyotaku\config'
          New-Item -ItemType Directory -Force $cfg | Out-Null
          "folders = ['$shots']`ntheme = 'dark'`nthreads = 2" | Set-Content (Join-Path $cfg 'config.toml')

          Start-Process .\dist\gyotaku\gyotaku-app.exe
          Start-Sleep -Seconds 2
          Alive; Shot '0-first-run'
          $found = $false
          foreach ($i in 1..90) {
            $hits = & .\dist\gyotaku\gyotaku.exe search cores 2>$null
            if ($hits) { $found = $true; break }
            Start-Sleep -Seconds 2
          }
          Get-Content (Join-Path $data 'reader.status') -ErrorAction SilentlyContinue
          Get-Content (Join-Path $data 'watch.log') -ErrorAction SilentlyContinue
          if (-not $found) { Shot '0-never-read'; throw 'the app never got the screenshot read' }

          # The window was opened before anything was searchable; summoning
          # it again shows the grid.
          [System.Windows.Forms.SendKeys]::SendWait('{ESC}')
          [System.Windows.Forms.SendKeys]::SendWait('%+s')
          Start-Sleep -Seconds 2
          Alive; Shot '1-open'
          [System.Windows.Forms.SendKeys]::SendWait('cores')
          Alive; Shot '2-search'
          [System.Windows.Forms.SendKeys]::SendWait('^,')
          Alive; Shot '3-settings'
          [System.Windows.Forms.SendKeys]::SendWait('{ESC}')
          [System.Windows.Forms.SendKeys]::SendWait('{ESC}')
          [System.Windows.Forms.SendKeys]::SendWait('{ESC}')
          Alive; Shot '4-hidden'
          [System.Windows.Forms.SendKeys]::SendWait('%+s')
          Alive; Shot '5-summoned'

          # Like Raycast: Alt+F4 puts the window away and the process keeps
          # waiting in the notification area.
          $first = (Get-Process gyotaku-app).Id
          [System.Windows.Forms.SendKeys]::SendWait('%{F4}')
          Alive; Shot '6-alt-f4'
          # Opening it again, the way the Start menu does, hands over to the
          # running copy, which shows the window.
          Start-Process .\dist\gyotaku\gyotaku-app.exe
          Start-Sleep -Seconds 2
          Alive; Shot '7-reopened'
          $now = @((Get-Process gyotaku-app).Id)
          if ($now.Count -ne 1 -or $now[0] -ne $first) { throw "a second launch didn't hand over to the running copy" }
          Get-Process gyotaku-app | Stop-Process -Force
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: windows-screens
          path: shots
          if-no-files-found: warn
      # The setup exe, from the same files: installed, updated over a running
      # gyotaku and uninstalled.
      - name: setup
        shell: pwsh
        run: contrib\windows\build-setup.ps1 dist\gyotaku
      - name: test the setup
        shell: pwsh
        run: contrib\windows\test-setup.ps1 dist\gyotaku-setup-x86_64.exe
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gyotaku-setup-x86_64
          path: dist/gyotaku-setup-x86_64.exe
          if-no-files-found: error

# Test builds for trying a change on a Windows machine are made locally with
# contrib/windows-dev.sh, in about a minute, and published from there.
