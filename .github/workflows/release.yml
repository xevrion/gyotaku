name: release

# Pushing a tag like v0.1.0 builds every download and publishes them as a
# GitHub release. install.sh and install.ps1 fetch from the latest one, so
# the file names never change between versions.
#
# Run by hand without a tag, it's a dry run: everything is built and the
# packages are installed and tested, but nothing is published.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish (empty for a dry run of this branch)
        required: false

env:
  CARGO_TERM_COLOR: always
  ORT_VERSION: 1.28.2
  ORT_WIN_SHA256: c4eedd29489d5feca21866d054638416f3655bf6b18851b3b6b85c8313e95c35
  ORT_MAC_SHA256: c4fceacfc53765d0869dc9180c31ec91054d149017a99d1e80ffe28dc79596de
  NFPM_VERSION: 2.47.0

permissions:
  contents: read

jobs:
  # Built on Ubuntu 22.04, the oldest glibc (2.35) CI tests, so the binaries
  # run there and on everything newer.
  linux:
    name: linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            goarch: amd64
            runner: ubuntu-22.04
            nfpm_sha256: 0660ca602b2d2d2ae4781a06c692b3eeb9d437ffea05b831d76e41f4a3188783
          - arch: aarch64
            goarch: arm64
            runner: ubuntu-22.04-arm
            nfpm_sha256: 1c0f5f2999b9a974bfb04fdb0cc3306096de530ac5dbb25d739cc5f5219c919c
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}
      - name: packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config \
            libfontconfig-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev
      - name: build
        run: cargo build --release --locked
      - name: read a screenshot
        run: |
          ./target/release/gyotaku ocr tests/fixtures/settings.png --threads 2 | tee ocr.txt
          grep -q "cores per screenshot" ocr.txt
      # The tarball carries the menu entry and icons in share/, laid out like
      # /usr/share, for install.sh and the AUR package to put in place.
      - name: package
        run: |
          name="gyotaku-${{ matrix.arch }}-linux"
          mkdir -p "dist/$name/share/applications" "dist/$name/share/metainfo"
          cp target/release/gyotaku target/release/gyotaku-app LICENSE "dist/$name/"
          cp packaging/linux/dev.xevrion.gyotaku.desktop "dist/$name/share/applications/"
          cp packaging/linux/dev.xevrion.gyotaku.metainfo.xml "dist/$name/share/metainfo/"
          cp -r packaging/linux/icons "dist/$name/share/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
      # The same files as a .deb and an .rpm, under names that don't change
      # between versions, like the tarball's.
      - name: deb and rpm
        run: |
          curl -sSfLo nfpm.tar.gz "https://github.com/goreleaser/nfpm/releases/download/v$NFPM_VERSION/nfpm_${NFPM_VERSION}_Linux_$(uname -m | sed 's/aarch64/arm64/').tar.gz"
          echo "${{ matrix.nfpm_sha256 }}  nfpm.tar.gz" | sha256sum -c -
          tar -xzf nfpm.tar.gz nfpm
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          name="gyotaku-${{ matrix.arch }}-linux"
          for format in deb rpm; do
            GYOTAKU_VERSION="$version" GYOTAKU_ARCH="${{ matrix.goarch }}" \
              ./nfpm package -f packaging/nfpm/nfpm.yaml -p "$format" -t "dist/$name.$format"
            (cd dist && sha256sum "$name.$format" > "$name.$format.sha256")
          done
          ls -l dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-${{ matrix.arch }}
          path: |
            dist/*.tar.gz*
            dist/*.deb*
            dist/*.rpm*
          if-no-files-found: error

  # Each package installed the way a user would, on the oldest systems it
  # claims to support, before anything is published. Installing through the
  # package manager also proves the dependencies resolve, and ldd proves
  # they're all the window needs.
  packages:
    name: ${{ matrix.name }}
    needs: linux
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: deb on ubuntu 22.04
            runner: ubuntu-24.04
            image: ubuntu:22.04
            file: gyotaku-x86_64-linux.deb
          - name: deb on debian 12
            runner: ubuntu-24.04
            image: debian:12
            file: gyotaku-x86_64-linux.deb
          - name: deb on ubuntu 24.04 arm
            runner: ubuntu-24.04-arm
            image: ubuntu:24.04
            file: gyotaku-aarch64-linux.deb
          - name: rpm on fedora
            runner: ubuntu-24.04
            image: fedora:latest
            file: gyotaku-x86_64-linux.rpm
          - name: rpm on fedora arm
            runner: ubuntu-24.04-arm
            image: fedora:latest
            file: gyotaku-aarch64-linux.rpm
          - name: rpm on opensuse tumbleweed
            runner: ubuntu-24.04
            image: opensuse/tumbleweed
            file: gyotaku-x86_64-linux.rpm
          - name: aur on arch
            runner: ubuntu-24.04
            image: archlinux:latest
            file: gyotaku-x86_64-linux.tar.gz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: install
        run: |
          set -eux
          case "${{ matrix.file }}" in
            *.deb)
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y "./dist/${{ matrix.file }}"
              ;;
            *.rpm)
              if command -v zypper >/dev/null; then
                zypper -n install --allow-unsigned-rpm "./dist/${{ matrix.file }}"
              else
                dnf install -y "./dist/${{ matrix.file }}" desktop-file-utils appstream /usr/bin/ldd
                desktop-file-validate /usr/share/applications/dev.xevrion.gyotaku.desktop
                appstreamcli validate --no-net /usr/share/metainfo/dev.xevrion.gyotaku.metainfo.xml
              fi
              ;;
            *.tar.gz)
              pacman -Syu --noconfirm --needed base-devel
              useradd -m builder
              cp -r packaging/aur /home/builder/aur
              version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
              sum=$(cut -d' ' -f1 "dist/${{ matrix.file }}.sha256")
              # The tarball built above stands in for the published one:
              # makepkg uses a source already in the folder instead of
              # downloading it.
              cp "dist/${{ matrix.file }}" "/home/builder/aur/gyotaku-$version-x86_64-linux.tar.gz"
              sed -i -e "s/^pkgver=.*/pkgver=$version/" \
                -e "s/^sha256sums_x86_64=.*/sha256sums_x86_64=('$sum')/" /home/builder/aur/PKGBUILD
              chown -R builder /home/builder/aur
              # The dependencies are installed by pacman -U below, which
              # proves they resolve; the builder isn't allowed to.
              su builder -c 'cd ~/aur && makepkg --noconfirm --nodeps'
              pacman -U --noconfirm /home/builder/aur/gyotaku-bin-*.pkg.tar.zst
              ;;
          esac
      - name: run what got installed
        run: |
          set -eux
          gyotaku --version
          test -x /usr/bin/gyotaku-app
          if ldd /usr/bin/gyotaku-app | grep "not found"; then exit 1; fi
          test -f /usr/share/applications/dev.xevrion.gyotaku.desktop
          test -f /usr/share/icons/hicolor/scalable/apps/dev.xevrion.gyotaku.svg
          gyotaku ocr tests/fixtures/settings.png --threads 2 | tee ocr.txt
          grep -q "cores per screenshot" ocr.txt
      - name: remove
        run: |
          set -eux
          case "${{ matrix.file }}" in
            *.deb) apt-get remove -y gyotaku ;;
            *.rpm) if command -v zypper >/dev/null; then zypper -n remove gyotaku; else dnf remove -y gyotaku; fi ;;
            *.tar.gz) pacman -R --noconfirm gyotaku-bin ;;
          esac
          test ! -e /usr/bin/gyotaku && test ! -e /usr/bin/gyotaku-app

  windows:
    name: windows x86_64
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}
      - name: build
        run: cargo build --release --locked
      - name: onnx runtime
        run: |
          curl -sSfLo ort.zip "https://github.com/microsoft/onnxruntime/releases/download/v$ORT_VERSION/onnxruntime-win-x64-$ORT_VERSION.zip"
          echo "$ORT_WIN_SHA256  ort.zip" | sha256sum -c -
          unzip -q -j ort.zip "onnxruntime-win-x64-$ORT_VERSION/lib/onnxruntime.dll" -d target/release
      # onnxruntime.dll needs the Visual C++ runtime, which a fresh Windows
      # doesn't have. Microsoft allows shipping these beside the program.
      - name: visual c++ runtime
        run: |
          crt=$(ls -d "/c/Program Files/Microsoft Visual Studio/"*/*/VC/Redist/MSVC/*/x64/Microsoft.VC14*.CRT 2>/dev/null | sort -V | tail -n1)
          echo "from ${crt:-System32}"
          for dll in msvcp140.dll msvcp140_1.dll vcruntime140.dll vcruntime140_1.dll; do
            cp "${crt:-/c/Windows/System32}/$dll" target/release/
          done
      - name: read a screenshot
        run: |
          ./target/release/gyotaku.exe ocr tests/fixtures/settings.png --threads 2 | tee ocr.txt
          grep -q "cores per screenshot" ocr.txt
      - name: package
        run: |
          name="gyotaku-x86_64-windows"
          mkdir -p "dist/$name"
          cp target/release/gyotaku-app.exe target/release/gyotaku.exe target/release/onnxruntime.dll "dist/$name/"
          cp target/release/msvcp140.dll target/release/msvcp140_1.dll target/release/vcruntime140.dll target/release/vcruntime140_1.dll "dist/$name/"
          cp LICENSE "dist/$name/LICENSE.txt"
          cp contrib/windows-readme.txt "dist/$name/README.txt"
          (cd "dist/$name" && 7z a -tzip "../$name.zip" . > /dev/null)
          (cd dist && sha256sum "$name.zip" > "$name.zip.sha256")
      # The same files as a setup exe, with a Start menu entry and an
      # uninstaller in Apps, tried before it's published.
      - name: setup
        shell: pwsh
        run: contrib\windows\build-setup.ps1 dist\gyotaku-x86_64-windows
      - name: test the setup
        shell: pwsh
        run: contrib\windows\test-setup.ps1 dist\gyotaku-setup-x86_64.exe
      - name: setup checksum
        run: (cd dist && sha256sum gyotaku-setup-x86_64.exe > gyotaku-setup-x86_64.exe.sha256)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-x86_64
          path: |
            dist/*.zip*
            dist/*.exe*
          if-no-files-found: error

  # Apple Silicon only: Microsoft publishes no ONNX Runtime build for
  # x86_64 macs, so Intel macs need a build from source with ORT_DYLIB_PATH.
  macos:
    name: macos aarch64
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}
      - name: build
        run: cargo build --release --locked
      # Microsoft's own build, checked against the same hash the app pins.
      - name: onnx runtime
        run: |
          curl -sSfLo ort.tgz "https://github.com/microsoft/onnxruntime/releases/download/v$ORT_VERSION/onnxruntime-osx-arm64-$ORT_VERSION.tgz"
          echo "$ORT_MAC_SHA256  ort.tgz" | shasum -a 256 -c -
          tar -xzf ort.tgz -C target/release --strip-components 2 onnxruntime-osx-arm64-$ORT_VERSION/lib/libonnxruntime.1.28.2.dylib
      - name: read a screenshot
        run: |
          ./target/release/gyotaku ocr tests/fixtures/settings.png --threads 2 | tee ocr.txt
          grep -q "cores per screenshot" ocr.txt
      - name: package
        run: |
          name="gyotaku-aarch64-macos"
          mkdir -p "dist/$name"
          cp target/release/gyotaku target/release/gyotaku-app target/release/libonnxruntime.1.28.2.dylib "dist/$name/"
          cp LICENSE "dist/$name/LICENSE.txt"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256")
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-aarch64
          path: dist/*.tar.gz*
          if-no-files-found: error

  publish:
    needs: [linux, packages, windows, macos]
    if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          ls -l dist
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            # GitHub's generated notes with one line under them. gh can only
            # put its own text above generated notes, so they are fetched
            # first and the line appended.
            gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$TAG" --jq .body > notes.md
            printf '\n---\n\ngyotaku is free and stays free. If it saves you time, [sponsoring](https://github.com/sponsors/xevrion) keeps it maintained.\n' >> notes.md
            gh release create "$TAG" dist/* --notes-file notes.md --title "gyotaku $TAG" --repo "$GITHUB_REPOSITORY"
          fi

  # The installers, run against what was just published.
  installers:
    needs: publish
    uses: ./.github/workflows/install.yml
