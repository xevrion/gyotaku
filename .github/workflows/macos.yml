name: macos

# Builds, tests and packages the macOS version: a folder with both programs
# and ONNX Runtime beside them, so it runs without Rust or any download
# other than the OCR models on first use.
on:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.cargo/**'
      - 'tests/**'
      - '.github/workflows/macos.yml'
  pull_request:
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.cargo/**'
      - 'tests/**'
      - '.github/workflows/macos.yml'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  ORT_VERSION: 1.28.2
  ORT_SHA256: c4fceacfc53765d0869dc9180c31ec91054d149017a99d1e80ffe28dc79596de

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macos arm64
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: build
        run: cargo build --release --locked
      - name: test
        run: cargo test --release --locked --workspace
      # Microsoft's own build, checked against the same hash the app pins.
      - name: onnx runtime
        run: |
          curl -sSfLo ort.tgz "https://github.com/microsoft/onnxruntime/releases/download/v$ORT_VERSION/onnxruntime-osx-arm64-$ORT_VERSION.tgz"
          echo "$ORT_SHA256  ort.tgz" | shasum -a 256 -c -
          tar -xzf ort.tgz -C target/release --strip-components 2 onnxruntime-osx-arm64-$ORT_VERSION/lib/libonnxruntime.1.28.2.dylib
      - name: read a screenshot
        run: |
          ./target/release/gyotaku ocr tests/fixtures/settings.png --threads 2 | tee ocr.txt
          grep -q "cores per screenshot" ocr.txt
      # A running reader must pick up what lands in its folders, the way a
      # person adds screenshots: copied in, moved in, written slowly, and taken
      # with screencapture. The folders cover the ways a configured path can
      # differ from the real one FSEvents reports: under /var (really
      # /private/var), through a symlink, and a plain one under the home
      # folder. All of them must be in the index within two minutes (reading
      # one takes from one to thirty seconds on a busy runner; a file whose
      # event was dropped never arrives at all).
      - name: reader follows new files
        run: |
          bin="$PWD/target/release/gyotaku"
          data="$HOME/Library/Application Support/gyotaku"
          fixture="$PWD/tests/fixtures/settings.png"
          var_dir="$(mktemp -d)/var-shots"
          mkdir -p "$var_dir" "$HOME/gyo-real" "$HOME/Pictures/gyo-plain"
          ln -s "$HOME/gyo-real" "$HOME/gyo-link"
          link_dir="$HOME/gyo-link"
          plain_dir="$HOME/Pictures/gyo-plain"
          mkdir -p "$data"
          printf "folders = ['%s', '%s', '%s']\nthreads = 2\n" "$var_dir" "$link_dir" "$plain_dir" > "$data/config.toml"

          "$bin" watch > /tmp/watch.log 2>&1 &
          watch_pid=$!
          for _ in $(seq 1 120); do
            grep -q "up to date" "$data/reader.status" 2>/dev/null && break
            sleep 1
          done
          echo "reader status: $(cat "$data/reader.status" 2>/dev/null)"

          cp "$fixture" "$var_dir/cp-var.png"
          cp "$fixture" "$link_dir/cp-link.png"
          cp "$fixture" "$plain_dir/cp-plain.png"
          cp "$fixture" /tmp/mv-src-1.png && mv /tmp/mv-src-1.png "$plain_dir/mv-plain.png"
          cp "$fixture" /tmp/mv-src-2.png && mv /tmp/mv-src-2.png "$var_dir/mv-var.png"
          # Written in chunks over a few seconds, like a slow tool.
          size=$(stat -f %z "$fixture")
          chunk=$(( size / 4 + 1 ))
          for i in 0 1 2 3; do
            dd if="$fixture" bs="$chunk" skip=$i count=1 2>/dev/null >> "$plain_dir/slow-plain.png"
            sleep 1
          done
          screencapture -x "$plain_dir/shot-plain.png" || echo "screencapture failed"

          names="cp-var cp-link cp-plain mv-plain mv-var slow-plain shot-plain"
          for _ in $(seq 1 120); do
            missing=0
            for name in $names; do
              sqlite3 "$data/index.db" "select path from shots" | grep -q "/$name.png$" || missing=1
            done
            [ "$missing" = 0 ] && break
            sleep 1
          done
          failed=0
          for name in $names; do
            if sqlite3 "$data/index.db" "select path from shots" | grep -q "/$name.png$"; then
              echo "$name: yes"
            else
              echo "$name: no"; failed=1
            fi
          done

          kill "$watch_pid" || true
          if [ "$failed" = 1 ]; then
            echo "--- indexed paths"; sqlite3 "$data/index.db" "select path from shots"
            echo "--- reader log"; cat /tmp/watch.log
            exit 1
          fi
          rm -f "$data/index.db" "$data/index.db-wal" "$data/index.db-shm" "$data/config.toml"
      - name: package
        run: |
          mkdir -p dist/gyotaku
          cp target/release/gyotaku target/release/gyotaku-app target/release/libonnxruntime.1.28.2.dylib dist/gyotaku/
          cp LICENSE dist/gyotaku/LICENSE.txt
          cp crates/app/fonts/OFL.txt dist/gyotaku/FONTS-OFL.txt
          cp contrib/macos-readme.txt dist/gyotaku/README.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gyotaku-macos-arm64
          path: dist/gyotaku
          if-no-files-found: error
      # Opens the real window on the runner's desktop and photographs it:
      # the grid, a search, settings, and the summon key bringing it back.
      # Typing goes through Accessibility, which the runner may not grant,
      # so the search and settings shots are best effort. The knock path,
      # what the summon key does, needs no keyboard permissions.
      - name: open the window
        run: |
          shots="$PWD/tests/fixtures"
          cfg="$HOME/Library/Application Support/gyotaku"
          mkdir -p "$cfg"
          printf "folders = ['%s']\ntheme = 'dark'\nthreads = 2\n" "$shots" > "$cfg/config.toml"
          ./dist/gyotaku/gyotaku index "$shots"

          ./dist/gyotaku/gyotaku-app >/tmp/gyotaku.log 2>&1 &
          sleep 8
          pgrep -x gyotaku-app >/dev/null || { cat /tmp/gyotaku.log; exit 1; }

          mkdir shots
          sleep 1.5
          screencapture -x shots/1-open.png

          # Typing needs Accessibility the runner may not grant.
          osascript -e 'tell application "System Events" to keystroke "cores"' || true
          sleep 1
          screencapture -x shots/2-search.png || true
          osascript -e 'tell application "System Events" to key code 43 using {control down}' || true
          sleep 1
          screencapture -x shots/3-settings.png || true

          # The summon key does this knock, which needs no keyboard permissions.
          sock="${TMPDIR:-/tmp/}gyotaku-$(id -u).sock"
          printf 'toggle\n' | nc -U "$sock"
          sleep 1
          screencapture -x shots/4-hidden.png
          printf 'toggle\n' | nc -U "$sock"
          sleep 2
          screencapture -x shots/5-summoned.png

          # Like Raycast, it runs as an accessory app: no Dock icon, and a
          # menu bar icon in its place.
          first=$(pgrep -x gyotaku-app)
          lsappinfo info -only ApplicationType "$first" | tee apptype.txt || true
          grep -qi uielement apptype.txt || echo "::warning::not listed as an accessory (UIElement) app: $(cat apptype.txt)"
          osascript -e 'tell application "System Events" to get every menu bar item of every menu bar of process "gyotaku-app"' || echo "::warning::couldn't read the menu bar icon"

          # Cmd+Q puts the window away instead of quitting. System Events
          # types into the frontmost app, so gyotaku is brought forward first.
          osascript -e 'tell application "System Events" to set frontmost of process "gyotaku-app" to true' || true
          sleep 0.5
          osascript -e 'tell application "System Events" to keystroke "q" using {command down}' || true
          sleep 1.5
          screencapture -x shots/6-cmd-q.png
          pgrep -x gyotaku-app >/dev/null || { echo "::error::cmd+q quit the app"; cat /tmp/gyotaku.log; exit 1; }

          # Opening it again hands over to the running copy, which shows the
          # window.
          ./dist/gyotaku/gyotaku-app >/dev/null 2>&1
          sleep 2
          screencapture -x shots/7-reopened.png
          [ "$(pgrep -x gyotaku-app)" = "$first" ] || { echo "::error::a second launch didn't hand over to the running copy"; exit 1; }

          kill $(pgrep -x gyotaku-app) || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: macos-screens
          path: shots
          if-no-files-found: warn
